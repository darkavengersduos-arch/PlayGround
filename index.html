<script>(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');const ui={overlay:document.getElementById('overlay'),panel:document.getElementById('panel'),score:document.getElementById('score'),shards:document.getElementById('shards'),distance:document.getElementById('distance'),health:document.getElementById('healthFill'),rage:document.getElementById('rageFill'),pause:document.getElementById('pauseBtn'),toast:document.getElementById('toast')};
let W=0,H=0,dpr=1,last=0,mode='menu',time=0,camera=0,score=0,shards=0,toastTimer=0,shake=0;const keys={left:false,right:false,jump:false,attack:false,dash:false};const world={length:9000,ground:0,platforms:[],hazards:[],pickups:[],drones:[],particles:[],rain:[],buildings:[],checkpoints:[0,2500,5100,7600]};const player={x:100,y:0,vx:0,vy:0,w:34,h:57,health:100,rage:0,facing:1,grounded:false,coyote:0,jumpBuffer:0,attack:0,dash:0,dashCooldown:0,invuln:0,anim:0,dead:false};let audio=null,mute=false,checkpoint=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);world.ground=H*.79;}window.addEventListener('resize',resize);resize();
function initWorld(){world.platforms=[];world.hazards=[];world.pickups=[];world.drones=[];world.particles=[];world.buildings=[];world.rain=[];for(let i=0;i<36;i++)world.buildings.push({x:i*265,w:rnd(80,190),h:rnd(H*.12,H*.48),layer:i%3,seed:rnd(0,100)});let x=530;while(x<world.length-350){const type=Math.random();if(type<.22)world.platforms.push({x:x+60,y:world.ground-rnd(90,145),w:rnd(110,190),h:16});else if(type<.5)world.hazards.push({x:x+60,y:world.ground-18,w:rnd(38,68),h:18,type:'spike',alive:true});else if(type<.72)world.hazards.push({x:x+70,y:world.ground-rnd(38,78),w:25,h:25,type:'mine',alive:true});if(Math.random()<.78)for(let j=0;j<3;j++)world.pickups.push({x:x+80+j*31,y:world.ground-rnd(65,105),r:8,got:false,phase:rnd(0,7)});if(Math.random()<.64)world.drones.push({x:x+rnd(90,190),y:world.ground-rnd(95,180),baseY:0,phase:rnd(0,7),hp:2,alive:true});x+=rnd(280,420);}for(const d of world.drones)d.baseY=d.y;for(let i=0;i<110;i++)world.rain.push({x:rnd(0,W),y:rnd(0,H),len:rnd(5,18),speed:rnd(230,520),alpha:rnd(.08,.32)});}
function resetGame(){initWorld();camera=0;score=0;shards=0;checkpoint=0;Object.assign(player,{x:100,y:world.ground-57,vx:0,vy:0,health:100,rage:20,facing:1,grounded:false,coyote:0,jumpBuffer:0,attack:0,dash:0,dashCooldown:0,invuln:0,anim:0,dead:false});updateHud();}function updateHud(){ui.score.textContent=String(score).padStart(6,'0');ui.shards.textContent=`${shards} / 8`;ui.distance.textContent=`${Math.max(0,Math.floor(player.x/10))} M`;ui.health.style.width=`${player.health}%`;ui.rage.style.width=`${player.rage}%`;}function showToast(s){ui.toast.textContent=s;ui.toast.classList.add('show');toastTimer=1.35;}
function panelMenu(){ui.panel.innerHTML=`<div class="eyebrow">CLASSIFIED // PROJECT VENOM</div><h1>CITY OF <span>TEETH.</span></h1><p class="panel-copy">The lab is burning. The hunters are closing in. Take back the night and make it to the extraction beacon.</p><div class="feature-row"><div class="feature"><b>ABSORB</b><span>Collect 8 shards</span></div><div class="feature"><b>RIP & TEAR</b><span>Strike with tendrils</span></div><div class="feature"><b>GET OUT</b><span>Reach the beacon</span></div></div><button class="primary" id="startBtn">ENTER THE NIGHT&nbsp; →</button><div class="fineprint">A / D OR ← / → MOVE &nbsp;·&nbsp; SPACE JUMP &nbsp;·&nbsp; J STRIKE &nbsp;·&nbsp; SHIFT RUSH</div>`;ui.overlay.classList.remove('hidden');document.getElementById('startBtn').onclick=startGame;}
function showResult(win){mode=win?'won':'dead';ui.panel.innerHTML=`<div class="eyebrow">${win?'CONTAINMENT BREACHED':'SIGNAL LOST'} // ${win?'EXTRACTION COMPLETE':'RETRY PROTOCOL'}</div><h1>${win?'NIGHT':'THE HUNT'}<span>${win?'CLAIMED.':'CONTINUES.'}</span></h1><p class="panel-copy">${win?'The city went quiet. For a moment. The symbiote remembers every shard you fed it.':'The hunters dragged you back into the light. The dark is patient — go again.'}</p><div class="result-score"><span>FINAL SCORE</span><strong>${String(score).padStart(6,'0')}</strong><span>SHARDS ${shards}/8</span></div><button class="primary" id="retryBtn">${win?'RUN IT BACK':'BREAK OUT AGAIN'}&nbsp; ↻</button><div class="fineprint">PRESS ENTER TO PLAY AGAIN</div>`;ui.overlay.classList.remove('hidden');document.getElementById('retryBtn').onclick=startGame;}
function startGame(){resetGame();mode='playing';ui.overlay.classList.add('hidden');ensureAudio();sound('start');last=performance.now();}function pauseGame(){if(mode==='playing'){mode='paused';ui.panel.innerHTML=`<div class="eyebrow">HOLD // THE NIGHT IS WAITING</div><h1>TAKE A <span>BREATH.</span></h1><p class="panel-copy">Your hunters are still out there. Pick up where you left off when you're ready.</p><button class="primary" id="resumeBtn">BACK TO THE HUNT&nbsp; →</button><div class="fineprint">PRESS P OR ESC TO RESUME</div>`;ui.overlay.classList.remove('hidden');document.getElementById('resumeBtn').onclick=resumeGame;}else if(mode==='paused')resumeGame();}function resumeGame(){mode='playing';ui.overlay.classList.add('hidden');last=performance.now();}ui.pause.addEventListener('click',pauseGame);
function ensureAudio(){if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)();}catch(e){audio=null;}}if(audio&&audio.state==='suspended')audio.resume();}function sound(type){if(mute||!audio)return;const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);let f=type==='hit'?115:type==='pickup'?580:type==='jump'?210:type==='dash'?95:150;o.type=type==='pickup'?'sine':'sawtooth';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*(type==='pickup'?1.7:.55),now+.12);g.gain.setValueAtTime(.055,now);g.gain.exponentialRampToValueAtTime(.001,now+.16);o.start(now);o.stop(now+.17);}
function setKey(k,v){if(k==='jump'&&v)player.jumpBuffer=.14;if(k==='attack'&&v&&!keys.attack&&mode==='playing')attack();if(k==='dash'&&v&&!keys.dash&&mode==='playing')dash();keys[k]=v;}window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','shift'].includes(k))e.preventDefault();if(k==='a'||k==='arrowleft')setKey('left',true);if(k==='d'||k==='arrowright')setKey('right',true);if(k==='w'||k==='arrowup'||k===' ')setKey('jump',true);if(k==='j'||k==='x')setKey('attack',true);if(k==='shift'||k==='k')setKey('dash',true);if((k==='p'||k==='escape')&&!['menu','dead','won'].includes(mode))pauseGame();if(k==='enter'&&['menu','dead','won'].includes(mode))startGame();});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')setKey('left',false);if(k==='d'||k==='arrowright')setKey('right',false);if(k==='w'||k==='arrowup'||k===' ')setKey('jump',false);if(k==='j'||k==='x')setKey('attack',false);if(k==='shift'||k==='k')setKey('dash',false);});document.querySelectorAll('.touch-btn').forEach(b=>{const k=b.dataset.key,down=e=>{e.preventDefault();ensureAudio();b.classList.add('down');setKey(k,true)},up=e=>{e.preventDefault();b.classList.remove('down');setKey(k,false)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);});
function attack(){if(player.attack>0)return;player.attack=.25;player.rage=Math.max(0,player.rage-9);sound('hit');const range=player.dash>0?110:86;for(const d of world.drones)if(d.alive&&Math.abs(d.x-player.x-player.facing*range*.55)<range&&Math.abs(d.y-(player.y+25))<95){d.hp--;d.x+=player.facing*22;if(d.hp<=0){d.alive=false;score+=180;player.rage=Math.min(100,player.rage+16);burst(d.x,d.y,'#b9ff39',16);}}for(const h of world.hazards)if(h.alive&&Math.abs(h.x-player.x-player.facing*range*.5)<range&&Math.abs(h.y-player.y)<110){h.alive=false;score+=60;burst(h.x,h.y,'#9bff43',10);}}
function dash(){if(player.dashCooldown>0||player.rage<15)return;player.dash=.2;player.dashCooldown=.72;player.rage-=15;player.invuln=.25;player.vx=player.facing*680;shake=7;sound('dash');}function burst(x,y,color,n=8){for(let i=0;i<n;i++)world.particles.push({x,y,vx:rnd(-190,190),vy:rnd(-220,70),life:rnd(.25,.65),max:.65,color,size:rnd(2,5)});}function hurt(amount){if(player.invuln>0)return;player.health-=amount;player.invuln=.8;player.vx=-player.facing*210;player.vy=-220;shake=10;sound('hit');burst(player.x+17,player.y+24,'#ed5c67',12);if(player.health<=0){player.health=0;showResult(false);}}
function update(dt){time+=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)ui.toast.classList.remove('show');}if(mode!=='playing')return;const p=player;p.anim+=dt;p.invuln=Math.max(0,p.invuln-dt);p.dashCooldown=Math.max(0,p.dashCooldown-dt);p.attack=Math.max(0,p.attack-dt);p.dash=Math.max(0,p.dash-dt);p.jumpBuffer=Math.max(0,p.jumpBuffer-dt);if(p.x>world.checkpoints[checkpoint]+180&&checkpoint<world.checkpoints.length-1)checkpoint++;const input=(keys.right?1:0)-(keys.left?1:0);if(input){p.facing=input;p.vx+=input*1500*dt;}else p.vx*=Math.pow(p.grounded?0.0001:0.82,dt*60);p.vx=clamp(p.vx,-280,280);if(p.dash>0)p.vx=p.facing*680;if(p.jumpBuffer>0&&(p.grounded||p.coyote>0)){p.vy=-560;p.grounded=false;p.coyote=0;p.jumpBuffer=0;sound('jump');burst(p.x+17,p.y+52,'#b9ff39',5);}p.vy+=1500*dt;p.vy=Math.min(p.vy,900);const oldY=p.y;p.x=clamp(p.x+p.vx*dt,0,world.length-30);p.y+=p.vy*dt;const ground=world.ground-p.h;if(p.y>=ground){p.y=ground;p.vy=0;p.grounded=true;p.coyote=.11}else{if(p.grounded)p.coyote=.11;else p.coyote=Math.max(0,p.coyote-dt);p.grounded=false;}for(const pl of world.platforms)if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&oldY+p.h<=pl.y+7&&p.y+p.h>=pl.y&&p.vy>=0){p.y=pl.y-p.h;p.vy=0;p.grounded=true;p.coyote=.11;}
for(const item of world.pickups){if(item.got)continue;const iy=item.y+Math.sin(time*3+item.phase)*5;if(Math.hypot(p.x+p.w/2-item.x,p.y+p.h/2-iy)<34){item.got=true;shards++;score+=100;p.rage=Math.min(100,p.rage+11);burst(item.x,iy,'#c7ff49',10);sound('pickup');showToast('SYMBIOTE SHARD ABSORBED');}}for(const h of world.hazards){if(!h.alive)continue;if(p.x+p.w-5>h.x&&p.x+5<h.x+h.w&&p.y+p.h>h.y&&p.y<h.y+h.h){if(p.dash>0){h.alive=false;score+=60;burst(h.x,h.y,'#b9ff39',10);}else hurt(h.type==='mine'?16:12);}}for(const d of world.drones){if(!d.alive)continue;d.phase+=dt;d.y=d.baseY+Math.sin(d.phase*2.2)*22;if(Math.abs(d.x-p.x)<36&&Math.abs(d.y-(p.y+25))<39){if(p.dash>0){d.alive=false;score+=180;burst(d.x,d.y,'#b9ff39',14);}else hurt(13);}}for(const b of world.particles){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=360*dt;b.life-=dt;}world.particles=world.particles.filter(b=>b.life>0);camera=clamp(p.x-W*.36,0,world.length-W);shake=Math.max(0,shake-dt*28);if(p.x>=world.length-170){score+=shards*250;showResult(true);}updateHud();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071014');g.addColorStop(.55,'#132020');g.addColorStop(1,'#111a19');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const glow=ctx.createRadialGradient(W*.71,H*.36,2,W*.71,H*.36,H*.55);glow.addColorStop(0,'rgba(87,173,133,.18)');glow.addColorStop(1,'rgba(3,8,10,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(let layer=0;layer<3;layer++){const speed=[.12,.28,.48][layer],alpha=[.24,.4,.7][layer];for(const b of world.buildings){let x=(b.x-camera*speed)%(world.length+W);if(x< -220)x+=world.length+W;const top=H-b.h*(.66+layer*.18);ctx.fillStyle=layer===2?'#101b1a':layer===1?'#0c1719':'#0a1417';ctx.fillRect(x,top,b.w,b.h+H*.3);ctx.fillStyle=`rgba(103,173,139,${alpha*.18})`;ctx.fillRect(x,top,b.w,2);for(let c=0;c<Math.floor(b.w/18);c++)for(let r=0;r<Math.floor(b.h/24);r++)if((c*7+r*3+Math.floor(b.seed))%5!==0){ctx.fillStyle=`rgba(182,238,167,${alpha*(.07+((c+r)%3)*.035)})`;ctx.fillRect(x+8+c*18,top+10+r*24,3,6);}}}ctx.fillStyle='rgba(185,255,57,.16)';ctx.font='900 11px system-ui';ctx.letterSpacing='4px';ctx.fillText('K L I N T  T O W E R',W*.63-camera*.08,H*.22);const floor=world.ground,fg=ctx.createLinearGradient(0,floor,0,H);fg.addColorStop(0,'#1a2522');fg.addColorStop(1,'#070b0d');ctx.fillStyle=fg;ctx.fillRect(0,floor,W,H-floor);ctx.strokeStyle='rgba(189,255,89,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,floor);ctx.lineTo(W,floor);ctx.stroke();for(let i=0;i<18;i++){const x=((i*113-camera*.8)%(W+120)+W+120)%(W+120)-50;ctx.strokeStyle='rgba(130,192,153,.08)';ctx.beginPath();ctx.moveTo(x,floor+9);ctx.lineTo(x-25,floor+23);ctx.lineTo(x+50,floor+23);ctx.stroke();}for(const r of world.rain){r.y+=r.speed/60;if(r.y>H){r.y=-20;r.x=rnd(0,W);}ctx.strokeStyle=`rgba(151,205,192,${r.alpha})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-5,r.y+r.len);ctx.stroke();}}
function drawWorld(){ctx.save();ctx.translate(-camera,0);const floor=world.ground;for(const pl of world.platforms){ctx.fillStyle='#283631';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);ctx.fillStyle='#b9ff39';ctx.globalAlpha=.5;ctx.fillRect(pl.x,pl.y,pl.w,2);ctx.globalAlpha=1;ctx.fillStyle='#0a1112';ctx.fillRect(pl.x+7,pl.y+pl.h,pl.w-14,6);}for(const h of world.hazards){if(!h.alive)continue;if(h.type==='spike'){ctx.fillStyle='#55734a';ctx.beginPath();for(let x=0;x<h.w;x+=16){ctx.moveTo(h.x+x,h.y+h.h);ctx.lineTo(h.x+x+8,h.y-5);ctx.lineTo(h.x+x+16,h.y+h.h);}ctx.fill();ctx.strokeStyle='#b9ff39';ctx.globalAlpha=.62;ctx.stroke();ctx.globalAlpha=1;}else{const pulse=.5+.5*Math.sin(time*8+h.x);ctx.fillStyle=`rgba(251,77,91,${.16+pulse*.22})`;ctx.beginPath();ctx.arc(h.x+h.w/2,h.y+h.h/2,18+pulse*5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2d252a';ctx.beginPath();ctx.arc(h.x+h.w/2,h.y+h.h/2,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff626d';ctx.beginPath();ctx.arc(h.x+h.w/2,h.y+h.h/2,3,0,Math.PI*2);ctx.fill();}}
for(const item of world.pickups){if(item.got)continue;const y=item.y+Math.sin(time*3+item.phase)*5;ctx.save();ctx.translate(item.x,y);ctx.rotate(time*1.6+item.phase);ctx.shadowColor='#c7ff49';ctx.shadowBlur=15;ctx.fillStyle='#d5ff64';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(7,0);ctx.lineTo(0,9);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();ctx.restore();}for(const d of world.drones){if(!d.alive)continue;ctx.save();ctx.translate(d.x,d.y);ctx.shadowColor='#fb5a64';ctx.shadowBlur=12;ctx.fillStyle='#202d2e';rr(-16,-11,32,22,6);ctx.fill();ctx.strokeStyle='#82908d';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#ff6970';ctx.fillRect(-5,-2,10,4);ctx.shadowBlur=0;ctx.strokeStyle='#71827c';ctx.beginPath();ctx.moveTo(-20,-14);ctx.lineTo(-11,-9);ctx.moveTo(20,-14);ctx.lineTo(11,-9);ctx.stroke();ctx.restore();}
const bx=world.length-130;ctx.fillStyle='rgba(185,255,57,.08)';ctx.fillRect(bx-25,0,50,floor);ctx.strokeStyle='#b9ff39';ctx.globalAlpha=.5+.35*Math.sin(time*4);ctx.beginPath();ctx.moveTo(bx,floor);ctx.lineTo(bx,25);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#d9ff7c';ctx.font='800 9px system-ui';ctx.textAlign='center';ctx.fillText('EXTRACTION',bx,floor-28);ctx.textAlign='left';for(const b of world.particles){ctx.globalAlpha=clamp(b.life/b.max,0,1);ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;drawPlayer();ctx.restore();}
function drawPlayer(){const p=player;ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);if(p.invuln>0&&Math.floor(time*18)%2===0)ctx.globalAlpha=.48;const lean=clamp(p.vx/800,-.24,.24);ctx.rotate(lean);const bob=p.grounded?Math.sin(p.anim*14)*Math.min(2,Math.abs(p.vx)/120):0;ctx.translate(0,bob);ctx.scale(p.facing,1);ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,p.h/2-1,24,5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#07100f';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,8);ctx.bezierCurveTo(-31,12,-24,31,-44,28);ctx.stroke();ctx.strokeStyle='#b9ff39';ctx.globalAlpha=.55;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-8,8);ctx.bezierCurveTo(-31,12,-24,31,-44,28);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#070b0d';ctx.strokeStyle='#354541';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-12,-16);ctx.quadraticCurveTo(-18,-5,-14,11);ctx.lineTo(-12,23);ctx.lineTo(-17,28);ctx.quadraticCurveTo(-17,32,-7,31);ctx.lineTo(-1,15);ctx.lineTo(4,16);ctx.lineTo(9,29);ctx.quadraticCurveTo(14,32,20,28);ctx.lineTo(14,9);ctx.lineTo(15,-9);ctx.quadraticCurveTo(11,-19,0,-18);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='rgba(171,201,187,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(0,-1);ctx.lineTo(9,-8);ctx.moveTo(-5,1);ctx.lineTo(0,7);ctx.lineTo(7,1);ctx.stroke();ctx.fillStyle='#080d0e';ctx.beginPath();ctx.ellipse(0,-23,14,16,-.05,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3c4d48';ctx.stroke();ctx.fillStyle='#eff9ed';ctx.shadowColor='#d7fff1';ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(-12,-28);ctx.quadraticCurveTo(-6,-34,0,-29);ctx.lineTo(-3,-22);ctx.quadraticCurveTo(-8,-22,-12,-25);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(2,-29);ctx.quadraticCurveTo(9,-35,13,-29);ctx.lineTo(10,-24);ctx.quadraticCurveTo(5,-22,1,-23);ctx.closePath();ctx.fill();ctx.shadowBlur=0;const wiggle=Math.sin(time*10+p.x*.03)*5;ctx.strokeStyle='#080d0d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-8,-12);ctx.quadraticCurveTo(-23,-24+wiggle,-2 function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);drawBackground();ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));drawWorld();ctx.restore();}function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;if(mode==='playing')update(dt);else{time+=dt;for(const r of world.rain){r.y+=r.speed*dt;if(r.y>H){r.y=-20;r.x=rnd(0,W);}}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)ui.toast.classList.remove('show');}}render();requestAnimationFrame(frame);}resetGame();panelMenu();last=performance.now();requestAnimationFrame(frame);
