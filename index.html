<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071012">
<title>VENOM: City of Teeth</title>
<style>
:root{color-scheme:dark;--acid:#bdff45;--cyan:#84e8dc;--ink:#071012}*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f7f2}body{touch-action:none}#game{position:relative}canvas{display:block;width:100%;height:100%}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#040a0bc0,transparent 23%,transparent 72%,#040809c9),radial-gradient(ellipse,transparent 42%,#0007)}
.hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(19px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{display:flex;align-items:center;gap:11px;text-shadow:0 2px 12px #000}.mark{width:37px;height:37px;border:1px solid #bdff4580;border-radius:11px;display:grid;place-items:center;color:var(--acid);font-weight:950;font-size:21px;background:#0b1415c9;box-shadow:0 0 24px #bdff391b}.brandTitle{font-size:12px;letter-spacing:.23em;font-weight:900}.brandSub{display:block;color:#9daaa6;font-size:9px;letter-spacing:.2em;margin-top:3px}.right{display:flex;gap:9px;align-items:center;pointer-events:auto}.chip{padding:9px 12px;border:1px solid #ffffff24;background:#091112c9;border-radius:10px;backdrop-filter:blur(8px);min-width:93px}.label{font-size:8px;letter-spacing:.19em;color:#9caaa4;font-weight:850}.value{margin-top:3px;font-size:14px;font-weight:850}.green{color:var(--acid)}button{font:inherit;color:inherit}.icon{width:38px;height:38px;border:1px solid #ffffff26;border-radius:10px;background:#091010dc;cursor:pointer}.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.mission{max-width:380px;color:#c0cbc5;font-size:11px;line-height:1.55;text-shadow:0 2px 8px #000;background:linear-gradient(90deg,#071010ad,transparent);padding:10px 24px 10px 0}.mission strong{display:block;color:#f4f8f2;letter-spacing:.14em;font-size:9px;margin-bottom:3px}.meterline{display:flex;align-items:center;gap:9px;margin-top:8px}.metername{font-size:8px;letter-spacing:.16em;color:#a6b1ac;font-weight:800}.meter{height:5px;width:144px;border-radius:9px;background:#ffffff20;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#78ce31,#d8ff58);transition:width .2s}.fill.rage{background:linear-gradient(90deg,#14c7bd,#bdff45)}.objective{text-align:right;font-size:8px;letter-spacing:.2em;color:#9eaca5;text-shadow:0 2px 8px #000}.objective b{display:block;color:var(--acid);font-size:14px;margin-top:4px;letter-spacing:.12em}.prompt{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid #bdff4566;background:#071111d9;border-radius:8px;color:#f5fff3;font-size:10px;letter-spacing:.12em;font-weight:850;display:none;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px #0009}.prompt.show{display:block}.toast{position:absolute;top:20%;left:50%;transform:translate(-50%,-6px);color:#e8f2eb;background:#091312e8;border:1px solid #caff4c50;padding:9px 15px;border-radius:99px;font-size:9px;letter-spacing:.13em;font-weight:800;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#03070872;backdrop-filter:blur(5px);transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.panel{position:relative;width:min(510px,calc(100vw - 32px));padding:34px 38px 29px;background:linear-gradient(145deg,#121c1cf5,#070c0ef7);border:1px solid #d5fff126;border-radius:18px;box-shadow:0 24px 90px #000b,0 0 60px #9fff3510;overflow:hidden}.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--acid),var(--cyan),transparent)}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--acid);font-size:9px;letter-spacing:.24em;font-weight:900}.eyebrow:before{content:"";width:20px;height:1px;background:var(--acid)}h1{font-size:clamp(35px,8vw,57px);line-height:.91;letter-spacing:-.06em;margin:19px 0 12px;font-weight:950}h1 span{display:block;color:var(--acid);text-shadow:0 0 28px #b9ff3930}.copy{font-size:12px;line-height:1.7;color:#a8b5b0}.features{display:flex;gap:8px;margin:19px 0 23px}.feature{flex:1;padding:10px 9px;border:1px solid #ffffff16;border-radius:9px;background:#ffffff06}.feature b{display:block;color:#eff5ef;font-size:9px;letter-spacing:.12em}.feature span{display:block;color:#83918b;font-size:9px;margin-top:4px}.primary{width:100%;border:0;border-radius:9px;background:var(--acid);color:#10170b;text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:950;padding:15px;cursor:pointer;box-shadow:0 5px 25px #b9ff3929;transition:.18s}.primary:hover{background:#d2ff74;transform:translateY(-2px)}.fine{text-align:center;color:#728079;font-size:9px;letter-spacing:.1em;margin-top:14px}.storyline{border-left:2px solid var(--acid);padding-left:14px;margin:17px 0;color:#dbe4dc;font-size:13px;line-height:1.65}.touch{position:absolute;inset:auto 0 max(16px,env(safe-area-inset-bottom)) 0;display:none;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none}.group{display:flex;gap:8px;align-items:flex-end}.tbtn{pointer-events:auto;width:54px;height:54px;border-radius:17px;border:1px solid #eaffee42;background:#091112b0;backdrop-filter:blur(8px);color:#eff7ef;font-weight:900;font-size:17px;touch-action:none;user-select:none}.tbtn.action{width:62px;height:62px;border-color:#bdff4577;color:var(--acid);font-size:9px;letter-spacing:.05em}.tbtn:active,.tbtn.down{background:#bdff3930;border-color:var(--acid)}
@media(max-width:760px){.touch{display:flex}.hud{padding-left:13px;padding-right:13px}.chip{min-width:68px;padding:7px 8px}.value{font-size:12px}.brandTitle{font-size:9px}.brandSub{font-size:7px}.mark{width:31px;height:31px}.mission{font-size:9px;max-width:245px}.meter{width:105px}.bottom{align-items:flex-start}.panel{padding:27px 24px 23px}}@media(max-height:520px){.touch{bottom:8px}.tbtn{width:45px;height:45px}.tbtn.action{width:53px;height:53px}.panel{padding:18px 24px}.panel h1{font-size:37px;margin:12px 0}.features{margin:10px 0}.copy{font-size:11px}}
</style>
</head>
<body><main id="game"><canvas id="scene" aria-label="3D city game"></canvas><div class="shade"></div>
<div class="hud"><div class="top"><div class="brand"><div class="mark">V</div><div><div class="brandTitle">VENOM // CITY OF TEETH</div><span class="brandSub">A LIVING CITY. A HUNGRY ALLY.</span></div></div><div class="right"><div class="chip"><div class="label">SYMBIOSIS</div><div class="value green" id="sync">24%</div></div><div class="chip"><div class="label">MEMORY</div><div class="value" id="memory">0 / 4</div></div><button class="icon" id="pause" aria-label="Pause">Ⅱ</button></div></div><div class="bottom"><div class="mission"><strong id="missionTitle">MISSION // A VOICE IN THE RAIN</strong><span id="missionText">Find the source of the signal downtown.</span><div class="meterline"><span class="metername">VITALITY</span><div class="meter"><div class="fill" id="health"></div></div></div><div class="meterline" style="margin-top:6px"><span class="metername">BOND</span><div class="meter"><div class="fill rage" id="bond"></div></div></div></div><div class="objective"><span id="district">OLD QUARTER</span><b id="distance">N 004 / E 008</b></div></div></div>
<div class="prompt" id="prompt"></div><div class="toast" id="toast"></div><div class="touch"><div class="group"><button class="tbtn" data-key="left">◀</button><button class="tbtn" data-key="right">▶</button><button class="tbtn" data-key="forward">▲</button><button class="tbtn" data-key="back">▼</button></div><div class="group"><button class="tbtn action" data-key="interact">TALK / ENTER</button><button class="tbtn action" data-key="attack">TENDRIL</button><button class="tbtn action" data-key="jump">JUMP</button></div></div>
<div class="overlay" id="overlay"><section class="panel" id="panel"></section></div></main>
<script type="module" src="./game.js"></script>
</body></html>
